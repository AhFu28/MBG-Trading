name: 24/7 AI Multi-Agent Arena Continuous Trading Engine

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' # Off-peak minutes to avoid GitHub Actions scheduler queue delays
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: arena-continuous-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  arena-continuous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Autonomous Multi-Tick Trading Loop (4 Minutes @ 30s Ticks)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MBG_REQUIRE_PRIVATE_PUBLISH: 'true'
        run: |
          python engine/analyzer/arena_runner_247.py --duration-seconds 240 --interval-seconds 30 > "$RUNNER_TEMP/mbg-private-engine.log" 2>&1

      - name: Send Telegram Failure Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ [MBG Arena Alert] 24/7 Workflow FAILED on ${{ github.ref_name }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
