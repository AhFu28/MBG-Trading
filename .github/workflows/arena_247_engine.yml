name: 24/7 AI Multi-Agent Arena Continuous Trading Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Continuous high-frequency execution every 5 minutes (24/7 Unlimited)
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: arena-continuous-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  arena-continuous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Autonomous Multi-Tick Trading Loop (4 Minutes @ 30s Ticks)
        run: |
          python engine/analyzer/arena_runner_247.py --duration-seconds 240 --interval-seconds 30

      - name: Commit & Push Updated Arena State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/latest_arena_state.json || true
          git diff --staged --quiet || (git commit -m "chore(arena): 24/7 multi-tick state update [skip ci]" && git push) || true

      - name: Send Telegram Failure Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ [MBG Arena Alert] 24/7 Workflow FAILED on ${{ github.ref_name }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
