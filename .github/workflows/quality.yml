name: Access and storage regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: npm ci --prefix frontend
      - run: pip install -r engine/requirements.txt
      - run: npm test
      - name: Compile Pages Functions without publishing
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm exec --yes --package=wrangler@4.147.0 -- wrangler pages functions build frontend/functions --outdir "$RUNNER_TEMP/mbg-functions"
      - name: Ensure no runtime snapshots are tracked or built
        run: |
          python - <<'PY'
          import pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = [p for p in paths if p.startswith(('engine/cache/', 'frontend/public/data/')) or p == 'frontend/src/data/dev_bundle.json']
          assert not forbidden, 'Private runtime payloads must never be tracked'
          assert not (pathlib.Path('frontend/dist') / 'data').exists(), 'Static output contains runtime data'
          PY
