name: 24/7 Hourly Crypto & US Macro Radar

on:
  schedule:
    # Hourly: crypto futures, on-chain whales, forex, macro telemetry.
    - cron: '0 * * * *'
    # Daily: US stocks and the earnings calendar.
    #
    # This ran only inside `daily_idx_morning`, which is workflow_dispatch-only —
    # so us_stocks refreshed only when somebody remembered to click Run. On
    # 2026-10-06 it was the one stale section in the bundle, 24.6 hours behind
    # everything else.
    #
    # It does NOT belong on the hourly cron: an earnings calendar changes at most
    # once a day, and the yfinance sweep over 30 tickers is the slowest fetch in
    # the pipeline. 22:30 UTC is 05:30 WIB, before the IDX pre-open.
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode (leave as-is for the normal hourly run)'
        required: false
        default: 'hourly_crypto_macro'
        type: choice
        options:
          - hourly_crypto_macro
          - us_stocks

permissions:
  contents: write

jobs:
  hourly-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
        run: |
          # Which cron fired is in github.event.schedule. workflow_dispatch has
          # no schedule value, so a manual run uses the mode input instead.
          MODE="${{ github.event.inputs.mode }}"

          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
              MODE="us_stocks"
            else
              MODE="hourly_crypto_macro"
            fi
          fi

          echo "Pipeline mode: $MODE"
          python engine/run_pipeline.py --mode "$MODE"

      - name: Validate the bundle before it can be published
        run: |
          echo "=== Bundle state after pipeline ==="
          python - <<'PY'
          import json, os, datetime, sys

          p = "engine/cache/latest_cockpit_bundle.json"
          if not os.path.exists(p):
              print("::error::Bundle does not exist after the pipeline ran.")
              sys.exit(1)

          raw = open(p, encoding="utf-8").read()

          # A rebase or autostash pop can leave conflict markers inside a file.
          # That produces invalid JSON, and a bundle the frontend cannot parse
          # blanks EVERY desk at once - seen locally on 2026-10-06, where
          # `<<<<<<< Updated upstream` landed at line 38510. Catch it here, where
          # it costs one failed run instead of a dead cockpit.
          for marker in ("<<<<<<<", "=======", ">>>>>>>"):
              if marker in raw:
                  print(f"::error::Conflict marker {marker!r} found in the bundle. Refusing to publish corrupt JSON.")
                  sys.exit(1)

          try:
              j = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Bundle is not valid JSON: {e}")
              sys.exit(1)

          if len(j) < 20:
              print(f"::error::Bundle has only {len(j)} sections; expected at least 20. Refusing to publish a truncated bundle.")
              sys.exit(1)

          m = datetime.datetime.fromtimestamp(os.path.getmtime(p))
          print(f"  size            : {len(raw):,} bytes")
          print(f"  sections        : {len(j)}")
          print(f"  file mtime      : {m}")
          print(f"  last_updated    : {j.get('last_updated')}")
          print(f"  mode            : {j.get('mode')}")
          cf = j.get("crypto_futures") or {}
          print(f"  crypto_futures  : {cf.get('updated_at')}  ({len(cf.get('funding_rates') or [])} pairs, source={cf.get('source')})")
          w = j.get("whale_intelligence") or {}
          print(f"  whale           : {w.get('updated_at')}  ({len(w.get('crypto_whales') or [])} whales)")
          fx = j.get("forex_intelligence") or {}
          print(f"  forex           : {fx.get('updated_at')}  ({len(fx.get('pairs') or [])} pairs)")
          print("  bundle is valid and publishable")
          PY
          echo "=== git status ==="
          git status --short

      - name: Commit & Push Updated Cockpit Data Bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # SECURITY: written to engine/cache, never frontend/public — a public
          # static bundle would leak VIP trade plans to unauthenticated visitors.
          #
          # ONLY the bundle is staged here. This step used to also stage
          # latest_arena_state.json, which the arena workflow owns — two writers
          # on one file is how a rebase conflict quietly discards work.
          git add engine/cache/latest_cockpit_bundle.json

          # FAIL LOUDLY WHEN NOTHING CHANGED.
          #
          # This workflow reported success 107 times while committing nothing
          # between 2026-09-26 and 2026-10-06. The bundle carries a fresh
          # `last_updated` timestamp on every run, so an unchanged bundle means
          # the pipeline did NOT write a file — a real fault. The old code
          # silently skipped the commit and returned green, so the failure was
          # invisible for ten days.
          if git diff --staged --quiet; then
            echo "::error::Bundle unchanged after the pipeline ran. The pipeline wrote nothing."
            echo "Expected: a new last_updated timestamp on every run."
            exit 1
          fi

          git commit -m "chore(data): automated hourly crypto, whale & macro refresh [skip ci]"

          # PUSH, AND DO NOT LIE ABOUT IT.
          #
          # Two separate faults hid here, both observed in run 37432538939 on
          # 2026-10-06 — the first run after the loud-failure guard was added:
          #
          #   1. `git pull --rebase` refused to start:
          #          error: cannot pull with rebase: You have unstaged changes.
          #      The pipeline writes several files under engine/cache (arena
          #      state, trade plans, idx categories). Only the bundle is staged,
          #      so the rest sit as modifications and rebase bails out. All three
          #      retries hit the same wall. --autostash fixes it: the pull
          #      proceeds, and the unrelated working-tree edits are restored
          #      afterwards untouched.
          #
          #   2. `cmd && git push && break || sleep 2` reports the exit status of
          #      `sleep 2`. The loop therefore ended green after three failed
          #      pushes, and the commit (8a17fe9, 15197 insertions of real data)
          #      died with the runner. The workflow must fail when a push never
          #      lands.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main && git push; then
              pushed=true
              break
            fi
            echo "::warning::push attempt $i failed, retrying"
            sleep 2
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not push the refreshed bundle after 3 attempts."
            exit 1
          fi
      - name: Send Telegram Failure Alert
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=⚠️ [MBG Pipeline Alert] Workflow '${{ github.workflow }}' FAILED on ${{ github.ref_name }}. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
