name: Secret Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on known leaked secrets
        run: |
          set -e
          # Scan for SECRET VALUES and credential assignments, not discussion labels.
          # The old scan flagged the admin emails (deliberate config since the admin
          # desk landed) and historical doc mentions, so it was permanently red and
          # nobody read it - which is exactly how a committed JWT_SECRET sailed
          # through unnoticed in 7b5d3f4. Alarm fatigue hides real leaks.
          HITS=$(grep -rn \
            -e "Arib1411892" \
            -e "d35bdd04ef763e558fec2f040990482f9375e9027e10f277786422c7dd8d182b" \
            -e "mbg_apex_jwt_secret" \
            -e "sb_secret_[A-Za-z0-9_-]\{20,\}" \
            -e "JWT_SECRET[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]\{16,\}" \
            -e "COCKPIT_PASSWORD=[^<]" \
            -e "PASSWORD_HASH=[^<[:space:]]" \
            -e "ADMIN_TOKEN=[^<[:space:]]" \
            --include="*.py" --include="*.js" --include="*.jsx" \
            --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.toml" \
            . | grep -v "MBG-Trading-AUDIT.md\|MBG-Trading-REMEDIATION-PLAN.md\|.github/workflows/secret-guard.yml\|\.env\.example" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Known leaked secret signatures found in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no leaked secret signatures detected."
