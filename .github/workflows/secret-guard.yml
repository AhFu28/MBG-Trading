name: Secret Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on known leaked secrets
        run: |
          set -e
          HITS=$(grep -rn \
            -e "Arib1411892" \
            -e "naufalarib60@gmail.com" \
            -e "MBG::Xk9" \
            -e "fallback-secret-for-dev" \
            -e "d35bdd04ef763e558fec2f040990482f9375e9027e10f277786422c7dd8d182b" \
            --include="*.py" --include="*.js" --include="*.jsx" \
            --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" \
            . | grep -v "MBG-Trading-AUDIT.md\|MBG-Trading-REMEDIATION-PLAN.md\|.github/workflows/secret-guard.yml" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Known leaked secret signatures found in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no leaked secret signatures detected."
