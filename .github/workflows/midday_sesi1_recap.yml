name: Midday Sesi 1 Recap (Manual On-Demand)

on:
  workflow_dispatch: # Allows manual trigger anytime (Cron scheduled runs disabled)

permissions:
  contents: read

jobs:
  midday-sesi1-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Midday Sesi 1 Recap (IDX Refresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
        run: |
          python engine/run_pipeline.py --mode daily_idx_morning

