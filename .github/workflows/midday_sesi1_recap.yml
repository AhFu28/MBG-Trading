name: Midday Sesi 1 Recap (12:15 WIB)

on:
  schedule:
    # 05:15 UTC is exactly 12:15 WIB (Monday to Friday)
    - cron: '15 5 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  midday-sesi1-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Midday Sesi 1 Recap (IDX Refresh)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/run_pipeline.py --mode daily_idx_morning

      - name: Commit Updated Daily Cards & Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ engine/cache/ || true
          git commit -m "[skip ci] 📊 midday sesi 1 recap update" || echo "No changes to commit"
          git push || echo "Push skipped"
