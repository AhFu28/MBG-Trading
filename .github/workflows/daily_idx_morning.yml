name: Daily IDX Morning Market Prep & Categorization

on:
  schedule:
    # 00:15 UTC is exactly 07:15 WIB (Monday to Friday)
    - cron: '15 0 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  idx-morning-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Full Market Prep (IDX Conglo, Dividend, Foreign Flow & Trade Plans)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
        run: |
          python engine/run_pipeline.py --mode all

      - name: Commit Updated Daily Cards & Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/ engine/cache/ || true
          git commit -m "chore(cron): publish daily morning IDX & crypto plans [skip ci]" || echo "No changes to commit"
          git pull --rebase
          git push || echo "Push skipped"
